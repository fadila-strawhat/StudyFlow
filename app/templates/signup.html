{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Sign Up | StudyFlow</title>
    <link rel="stylesheet" href="{% static 'app/style.css' %}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">StudyFlow 📚</div>
    </nav>

    <main class="container">

        <section class="hero">
            <h1>Create Your Account 🚀</h1>
            <p>Start organizing your assignments with StudyFlow.</p>
        </section>

        <form method="POST">

            {% csrf_token %}

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <label for="confirm_password">Confirm Password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p>
            Already have an account?
            <p>Already have an account? Login coming soon.</p>
        </p>

    </main>

</body>
</html>
